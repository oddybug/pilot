<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEF Query Bridge</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
      }
      button {
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        transition: background 0.2s;
      }
      button:hover {
        background-color: #0056b3;
      }
      /* Added a simple class for the 'active' state */
      button.clicked {
        background-color: #6c757d !important;
      }
      #status {
        margin-top: 20px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <button id="sendQueryBtn">Send Message to C++</button>
      <p id="status">Waiting for interaction...</p>
    </div>

    <script>
      document
        .getElementById("sendQueryBtn")
        .addEventListener("click", function () {
          const statusElement = document.getElementById("status");
          const btn = this;
          // 1. Change color immediately on click
          btn.classList.add("clicked");
          btn.innerText = "Sending...";
          // Ensure the CEF query object exists
          var result = window.sayHello("Interaction Test");
          console.log(result);
        });
    </script>
  </body>
</html>
