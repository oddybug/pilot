<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEF Query Bridge</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
      }
      button {
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        transition: background 0.2s;
      }
      button:hover {
        background-color: #0056b3;
      }
      button.clicked {
        background-color: #6c757d !important;
      }
      #status {
        margin-top: 20px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <button id="sendQueryBtnStr">Send string to C++</button>
      <p id="result">Waiting for interaction...</p>
      <br />
      <button id="sendQueryBtnInt">Send number to C++</button>
      <p id="resultInt">Waiting for interaction...</p>
      <p id="PushText">Waiting for push interaction...</p>
    </div>

    <script>
      const btnInt = document.getElementById("sendQueryBtnInt");
      const btn = document.getElementById("sendQueryBtnStr");
      const resultText = document.getElementById("result");
      const resultTextInt = document.getElementById("resultInt");
      const resultPush = document.getElementById("PushText");

      // Handle the button click to send message to C++
      btn.addEventListener("click", function () {
        btn.classList.add("clicked");
        resultText.innerText = "Sending request to C++...";

        // Triggers C++ IPC flow
        app.setMessageCallback(
          "binding_test",
          function (name) {
            resultText.innerText = "Response: " + name;
            btn.classList.remove("clicked");
          },
          "hola",
        );
      });

      var n = 0;
      btnInt.addEventListener("click", function () {
        btnInt.classList.add("clicked");
        resultTextInt.innerText = "Sending request to C++...";

        // Triggers C++ IPC flow

        app.PullMessage(
          "another_call",
          function (number) {
            n += 1;
            resultTextInt.innerText = "Response: " + number;
            btnInt.classList.remove("clicked");
            return true;
          },
          Number(2),
        );
      });

      function test(a) {
        resultPush.innerText = "Push msg: " + a;
      }

      app.SetPushClbk("hello", test);
    </script>
  </body>
</html>
